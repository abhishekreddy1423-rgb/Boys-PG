<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="tileWall" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f0fdf4" />
      <stop offset="100%" stop-color="#dcfce7" />
    </linearGradient>
    <linearGradient id="chrome" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="50%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>
  </defs>

  <rect width="800" height="420" fill="url(#tileWall)" />
  <!-- Tile grid lines -->
  <line x1="0" y1="100" x2="800" y2="100" stroke="#bbf7d0" stroke-width="2" />
  <line x1="0" y1="200" x2="800" y2="200" stroke="#bbf7d0" stroke-width="2" />
  <line x1="0" y1="300" x2="800" y2="300" stroke="#bbf7d0" stroke-width="2" />
  <line x1="160" y1="0" x2="160" y2="420" stroke="#bbf7d0" stroke-width="2" />
  <line x1="320" y1="0" x2="320" y2="420" stroke="#bbf7d0" stroke-width="2" />
  <line x1="480" y1="0" x2="480" y2="420" stroke="#bbf7d0" stroke-width="2" />
  <line x1="640" y1="0" x2="640" y2="420" stroke="#bbf7d0" stroke-width="2" />

  <polygon points="0,420 800,420 800,600 0,600" fill="#047857" />

  <!-- Geyser / Instant Water Heater on Wall -->
  <g transform="translate(180, 60)">
    <rect x="0" y="0" width="90" height="130" rx="20" fill="#ffffff" stroke="#94a3b8" stroke-width="3" />
    <circle cx="45" cy="50" r="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2" />
    <circle cx="38" cy="85" r="4" fill="#10b981" /> <!-- Green power light -->
    <circle cx="52" cy="85" r="4" fill="#ef4444" /> <!-- Red heating light -->
    <text x="45" y="110" fill="#047857" font-family="'Segoe UI', Inter, sans-serif" font-size="9" font-weight="700" text-anchor="middle">24/7 GEYSER</text>
    <!-- Hot & cold pipes -->
    <path d="M25,130 L25,230" stroke="#ef4444" stroke-width="4" fill="none" />
    <path d="M65,130 L65,230" stroke="#0284c7" stroke-width="4" fill="none" />
  </g>

  <!-- Mirror & Washbasin -->
  <g transform="translate(380, 80)">
    <!-- Mirror with reflection -->
    <rect x="20" y="0" width="120" height="140" rx="10" fill="#e0f2fe" stroke="#38bdf8" stroke-width="3" />
    <line x1="40" y1="20" x2="80" y2="120" stroke="#ffffff" stroke-width="3" opacity="0.7" />
    <!-- Ceramic Wash Basin -->
    <path d="M0,170 C0,220 160,220 160,170 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="3" />
    <rect x="10" y="160" width="140" height="15" rx="3" fill="#f8fafc" stroke="#94a3b8" stroke-width="2" />
    <!-- Chrome Tap -->
    <path d="M80,160 L80,135 Q80,120 70,120 L65,120" stroke="url(#chrome)" stroke-width="6" fill="none" stroke-linecap="round" />
    <!-- Pedestal column -->
    <rect x="65" y="210" width="30" height="150" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" />
  </g>

  <!-- Shower Area with Chrome Overhead Shower -->
  <g transform="translate(620, 80)">
    <path d="M0,40 L60,40 L60,70" stroke="url(#chrome)" stroke-width="6" fill="none" />
    <ellipse cx="60" cy="75" rx="22" ry="8" fill="url(#chrome)" />
    <!-- Water spray droplets -->
    <line x1="50" y1="85" x2="45" y2="170" stroke="#38bdf8" stroke-width="2" stroke-dasharray="8 6" opacity="0.6" />
    <line x1="60" y1="85" x2="60" y2="180" stroke="#38bdf8" stroke-width="2" stroke-dasharray="8 6" opacity="0.6" />
    <line x1="70" y1="85" x2="75" y2="170" stroke="#38bdf8" stroke-width="2" stroke-dasharray="8 6" opacity="0.6" />
  </g>

  <!-- Tag Pill -->
  <g transform="translate(30, 520)">
    <rect width="240" height="42" rx="21" fill="#0f2b48" opacity="0.95" stroke="#10b981" stroke-width="2" />
    <circle cx="24" cy="21" r="7" fill="#10b981" />
    <text x="40" y="26" fill="#ffffff" font-family="'Segoe UI', Poppins, sans-serif" font-size="13" font-weight="700">Clean Sanitized Bathrooms</text>
  </g>
</svg>
