<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="diningWall" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb" />
      <stop offset="100%" stop-color="#fef3c7" />
    </linearGradient>
    <linearGradient id="counterSteel" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="50%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>
  </defs>

  <rect width="800" height="380" fill="url(#diningWall)" />
  <polygon points="0,380 800,380 800,600 0,600" fill="#e2e8f0" />
  <line x1="0" y1="460" x2="800" y2="460" stroke="#cbd5e1" stroke-width="2" />
  <line x1="0" y1="530" x2="800" y2="530" stroke="#cbd5e1" stroke-width="2" />

  <!-- Mess Serving Counter at the Back -->
  <rect x="140" y="160" width="520" height="90" rx="6" fill="url(#counterSteel)" stroke="#475569" stroke-width="2" />
  <text x="400" y="195" fill="#1e293b" font-family="'Segoe UI', Poppins, sans-serif" font-size="14" font-weight="700" text-anchor="middle">HOT FOOD SERVING COUNTER • UNLIMITED MEALS</text>
  
  <!-- Food Warmers / Chafing Dishes on Counter -->
  <g transform="translate(180, 130)">
    <rect x="0" y="10" width="70" height="25" rx="4" fill="#cbd5e1" stroke="#475569" />
    <path d="M10,10 C10,-2 60,-2 60,10 Z" fill="#94a3b8" />
    <circle cx="35" cy="0" r="3" fill="#ea580c" />
    <!-- Steam -->
    <path d="M30,-5 Q25,-15 30,-22" stroke="#ea580c" stroke-width="2" fill="none" opacity="0.6" />
    <path d="M40,-5 Q45,-15 40,-22" stroke="#ea580c" stroke-width="2" fill="none" opacity="0.6" />
  </g>

  <g transform="translate(300, 130)">
    <rect x="0" y="10" width="70" height="25" rx="4" fill="#cbd5e1" stroke="#475569" />
    <path d="M10,10 C10,-2 60,-2 60,10 Z" fill="#94a3b8" />
    <circle cx="35" cy="0" r="3" fill="#ea580c" />
    <path d="M30,-5 Q25,-15 30,-22" stroke="#ea580c" stroke-width="2" fill="none" opacity="0.6" />
  </g>

  <g transform="translate(420, 130)">
    <rect x="0" y="10" width="70" height="25" rx="4" fill="#cbd5e1" stroke="#475569" />
    <path d="M10,10 C10,-2 60,-2 60,10 Z" fill="#94a3b8" />
    <circle cx="35" cy="0" r="3" fill="#ea580c" />
    <path d="M35,-5 Q40,-15 35,-22" stroke="#ea580c" stroke-width="2" fill="none" opacity="0.6" />
  </g>

  <g transform="translate(540, 130)">
    <rect x="0" y="10" width="70" height="25" rx="4" fill="#cbd5e1" stroke="#475569" />
    <path d="M10,10 C10,-2 60,-2 60,10 Z" fill="#94a3b8" />
    <circle cx="35" cy="0" r="3" fill="#ea580c" />
  </g>

  <!-- Clean Stainless Steel Dining Tables & Benches in Foreground -->
  <g transform="translate(100, 320)">
    <rect x="0" y="0" width="260" height="30" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="2" />
    <rect x="30" y="30" width="10" height="150" fill="#64748b" />
    <rect x="220" y="30" width="10" height="150" fill="#64748b" />
    <!-- Steel Benches -->
    <rect x="-10" y="60" width="280" height="14" rx="2" fill="#cbd5e1" stroke="#64748b" stroke-width="1" />
    <!-- Steel Plates & Tumblers -->
    <circle cx="60" cy="15" r="12" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2" />
    <rect x="80" y="6" width="10" height="18" rx="2" fill="#cbd5e1" />
    <circle cx="140" cy="15" r="12" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2" />
    <rect x="160" y="6" width="10" height="18" rx="2" fill="#cbd5e1" />
    <circle cx="210" cy="15" r="12" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2" />
  </g>

  <g transform="translate(440, 320)">
    <rect x="0" y="0" width="260" height="30" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="2" />
    <rect x="30" y="30" width="10" height="150" fill="#64748b" />
    <rect x="220" y="30" width="10" height="150" fill="#64748b" />
    <!-- Steel Benches -->
    <rect x="-10" y="60" width="280" height="14" rx="2" fill="#cbd5e1" stroke="#64748b" stroke-width="1" />
    <!-- Steel Plates & Tumblers -->
    <circle cx="60" cy="15" r="12" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2" />
    <circle cx="140" cy="15" r="12" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2" />
    <circle cx="210" cy="15" r="12" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2" />
  </g>

  <!-- RO Water Dispenser station in corner -->
  <g transform="translate(710, 220)">
    <rect x="0" y="0" width="60" height="120" rx="4" fill="#0284c7" />
    <rect x="10" y="10" width="40" height="40" rx="2" fill="#ffffff" />
    <circle cx="20" cy="65" r="4" fill="#ef4444" /> <!-- Hot tap -->
    <circle cx="40" cy="65" r="4" fill="#3b82f6" /> <!-- Cold tap -->
    <text x="30" y="95" fill="#ffffff" font-family="'Segoe UI', Inter, sans-serif" font-size="8" font-weight="700" text-anchor="middle">RO WATER</text>
  </g>

  <!-- Menu Board on Wall -->
  <rect x="40" y="50" width="180" height="110" rx="4" fill="#1e293b" stroke="#ea580c" stroke-width="2" />
  <text x="130" y="75" fill="#ea580c" font-family="'Segoe UI', Poppins, sans-serif" font-size="11" font-weight="700" text-anchor="middle">HOMELY MESS</text>
  <text x="130" y="95" fill="#f8fafc" font-family="'Segoe UI', Inter, sans-serif" font-size="9" text-anchor="middle">Pure Veg &amp; Non-Veg</text>
  <text x="130" y="112" fill="#f8fafc" font-family="'Segoe UI', Inter, sans-serif" font-size="9" text-anchor="middle">Unlimited Servings</text>
  <text x="130" y="130" fill="#facc15" font-family="'Segoe UI', Inter, sans-serif" font-size="9" font-weight="600" text-anchor="middle">Sunday Biryani Feast</text>

  <!-- Tag Pill -->
  <g transform="translate(30, 520)">
    <rect width="230" height="42" rx="21" fill="#0f2b48" opacity="0.9" stroke="#ea580c" stroke-width="2" />
    <circle cx="24" cy="21" r="7" fill="#ea580c" />
    <text x="40" y="26" fill="#ffffff" font-family="'Segoe UI', Poppins, sans-serif" font-size="13" font-weight="700">Hygienic Dining Hall</text>
  </g>
</svg>
