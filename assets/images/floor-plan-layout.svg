<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <!-- Blueprint style Architectural Floor Plan Graphic -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e3a8a" stroke-width="0.8" opacity="0.3" />
    </pattern>
  </defs>

  <!-- Background Blueprint Blue -->
  <rect width="800" height="600" fill="#0f2b48" />
  <rect width="800" height="600" fill="url(#grid)" />

  <!-- Room Boundary Walls (Thick White Lines) -->
  <rect x="80" y="80" width="640" height="440" fill="none" stroke="#ffffff" stroke-width="8" rx="4" />
  
  <!-- Attached Bathroom (Top Right) -->
  <rect x="520" y="80" width="200" height="180" fill="#1e3a8a" opacity="0.4" stroke="#ffffff" stroke-width="6" />
  <text x="620" y="150" fill="#38bdf8" font-family="'Segoe UI', Poppins, sans-serif" font-size="14" font-weight="700" text-anchor="middle">ATTACHED</text>
  <text x="620" y="170" fill="#38bdf8" font-family="'Segoe UI', Poppins, sans-serif" font-size="14" font-weight="700" text-anchor="middle">WASHROOM</text>
  <text x="620" y="195" fill="#facc15" font-family="'Segoe UI', Inter, sans-serif" font-size="11" text-anchor="middle">Geyser + Shower</text>
  <circle cx="580" cy="220" r="16" fill="none" stroke="#38bdf8" stroke-width="2" />
  <!-- Bath Door Swing -->
  <path d="M520,220 A40,40 0 0,1 560,260" fill="none" stroke="#facc15" stroke-width="2" stroke-dasharray="4 4" />

  <!-- Bed 1 (Left Wall) -->
  <rect x="90" y="110" width="180" height="100" fill="#0284c7" stroke="#ffffff" stroke-width="3" rx="4" />
  <rect x="100" y="125" width="30" height="70" fill="#ffffff" rx="4" />
  <text x="180" y="165" fill="#ffffff" font-family="'Segoe UI', Inter, sans-serif" font-size="13" font-weight="700" text-anchor="middle">BED 1 (Cot + Mattress)</text>

  <!-- Bed 2 (Left Wall Lower) -->
  <rect x="90" y="270" width="180" height="100" fill="#0284c7" stroke="#ffffff" stroke-width="3" rx="4" />
  <rect x="100" y="285" width="30" height="70" fill="#ffffff" rx="4" />
  <text x="180" y="325" fill="#ffffff" font-family="'Segoe UI', Inter, sans-serif" font-size="13" font-weight="700" text-anchor="middle">BED 2 (Cot + Mattress)</text>

  <!-- Individual Lockable Cupboards (Bottom Wall) -->
  <rect x="100" y="460" width="220" height="50" fill="#ea580c" stroke="#ffffff" stroke-width="3" rx="4" />
  <line x1="210" y1="460" x2="210" y2="510" stroke="#ffffff" stroke-width="2" />
  <text x="210" y="490" fill="#ffffff" font-family="'Segoe UI', Inter, sans-serif" font-size="11" font-weight="700" text-anchor="middle">INDIVIDUAL CUPBOARDS</text>

  <!-- Study Desk & Ergonomic Chairs (Center / Right) -->
  <rect x="360" y="320" width="140" height="70" fill="#f59e0b" stroke="#ffffff" stroke-width="3" rx="4" />
  <circle cx="395" cy="355" r="16" fill="#334155" stroke="#ffffff" stroke-width="2" />
  <circle cx="465" cy="355" r="16" fill="#334155" stroke="#ffffff" stroke-width="2" />
  <text x="430" y="415" fill="#fef08a" font-family="'Segoe UI', Inter, sans-serif" font-size="11" font-weight="700" text-anchor="middle">STUDY TABLE &amp; CHAIRS</text>

  <!-- Room Entrance Door (Bottom Right) -->
  <line x1="560" y1="520" x2="620" y2="520" stroke="#0f2b48" stroke-width="12" />
  <path d="M560,520 A60,60 0 0,0 620,460" fill="none" stroke="#facc15" stroke-width="3" stroke-dasharray="6 4" />
  <text x="640" y="500" fill="#facc15" font-family="'Segoe UI', Inter, sans-serif" font-size="11" font-weight="bold">ENTRANCE</text>

  <!-- Large Window (Top Wall) -->
  <line x1="260" y1="80" x2="440" y2="80" stroke="#38bdf8" stroke-width="12" />
  <text x="350" y="65" fill="#38bdf8" font-family="'Segoe UI', Inter, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">WINDOW (DAYLIGHT &amp; AIR)</text>

  <!-- Architectural Title Block -->
  <g transform="translate(480, 420)">
    <rect width="220" height="70" rx="4" fill="#0b1329" stroke="#38bdf8" stroke-width="2" />
    <text x="110" y="25" fill="#ffffff" font-family="'Segoe UI', Poppins, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">TYPICAL ROOM LAYOUT</text>
    <text x="110" y="44" fill="#38bdf8" font-family="'Segoe UI', Inter, sans-serif" font-size="10" text-anchor="middle">Dimensions: 14 ft × 16 ft</text>
    <text x="110" y="60" fill="#10b981" font-family="'Segoe UI', Inter, sans-serif" font-size="9" font-weight="bold" text-anchor="middle">Cross Ventilation • Attached Bath</text>
  </g>
</svg>
