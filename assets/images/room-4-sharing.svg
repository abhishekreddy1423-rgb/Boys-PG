<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="roomWall4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <linearGradient id="bunkGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#1e40af" />
    </linearGradient>
    <linearGradient id="bunkGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f766e" />
      <stop offset="100%" stop-color="#115e59" />
    </linearGradient>
  </defs>

  <rect width="800" height="420" fill="url(#roomWall4)" />
  <polygon points="0,420 800,420 800,600 0,600" fill="#94a3b8" />

  <!-- Center Big Window -->
  <rect x="290" y="60" width="220" height="160" rx="4" fill="#e0f2fe" stroke="#64748b" stroke-width="4" />
  <line x1="400" y1="60" x2="400" y2="220" stroke="#64748b" stroke-width="3" />
  <line x1="290" y1="140" x2="510" y2="140" stroke="#64748b" stroke-width="3" />

  <!-- Left Double Bunk Bed -->
  <g transform="translate(60, 160)">
    <!-- Vertical Frame Posts -->
    <rect x="0" y="0" width="14" height="340" fill="#1e293b" />
    <rect x="210" y="0" width="14" height="340" fill="#1e293b" />
    <!-- Safety Rail Upper -->
    <rect x="14" y="60" width="196" height="12" fill="#334155" />
    <!-- Upper Bed -->
    <rect x="14" y="80" width="196" height="50" rx="4" fill="url(#bunkGrad1)" />
    <rect x="20" y="90" width="30" height="30" rx="4" fill="#ffffff" />
    <!-- Lower Bed -->
    <rect x="14" y="240" width="196" height="50" rx="4" fill="url(#bunkGrad1)" />
    <rect x="20" y="250" width="30" height="30" rx="4" fill="#ffffff" />
    <!-- Bed Ladder -->
    <rect x="180" y="20" width="8" height="300" fill="#475569" />
    <line x1="180" y1="80" x2="210" y2="80" stroke="#cbd5e1" stroke-width="4" />
    <line x1="180" y1="140" x2="210" y2="140" stroke="#cbd5e1" stroke-width="4" />
    <line x1="180" y1="200" x2="210" y2="200" stroke="#cbd5e1" stroke-width="4" />
    <line x1="180" y1="260" x2="210" y2="260" stroke="#cbd5e1" stroke-width="4" />
  </g>

  <!-- Right Double Bunk Bed -->
  <g transform="translate(520, 160)">
    <!-- Vertical Frame Posts -->
    <rect x="0" y="0" width="14" height="340" fill="#1e293b" />
    <rect x="210" y="0" width="14" height="340" fill="#1e293b" />
    <!-- Safety Rail Upper -->
    <rect x="14" y="60" width="196" height="12" fill="#334155" />
    <!-- Upper Bed -->
    <rect x="14" y="80" width="196" height="50" rx="4" fill="url(#bunkGrad2)" />
    <rect x="170" y="90" width="30" height="30" rx="4" fill="#ffffff" />
    <!-- Lower Bed -->
    <rect x="14" y="240" width="196" height="50" rx="4" fill="url(#bunkGrad2)" />
    <rect x="170" y="250" width="30" height="30" rx="4" fill="#ffffff" />
    <!-- Bed Ladder -->
    <rect x="30" y="20" width="8" height="300" fill="#475569" />
    <line x1="14" y1="80" x2="38" y2="80" stroke="#cbd5e1" stroke-width="4" />
    <line x1="14" y1="140" x2="38" y2="140" stroke="#cbd5e1" stroke-width="4" />
    <line x1="14" y1="200" x2="38" y2="200" stroke="#cbd5e1" stroke-width="4" />
    <line x1="14" y1="260" x2="38" y2="260" stroke="#cbd5e1" stroke-width="4" />
  </g>

  <!-- Individual 4 Lockers in Center -->
  <g transform="translate(320, 260)">
    <rect x="0" y="0" width="160" height="180" rx="4" fill="#475569" stroke="#1e293b" stroke-width="3" />
    <line x1="80" y1="0" x2="80" y2="180" stroke="#1e293b" stroke-width="2" />
    <line x1="0" y1="90" x2="160" y2="90" stroke="#1e293b" stroke-width="2" />
    <circle cx="68" cy="45" r="3" fill="#fbbf24" />
    <circle cx="148" cy="45" r="3" fill="#fbbf24" />
    <circle cx="68" cy="135" r="3" fill="#fbbf24" />
    <circle cx="148" cy="135" r="3" fill="#fbbf24" />
    <text x="80" y="210" fill="#0f172a" font-family="'Segoe UI', Inter, sans-serif" font-size="11" font-weight="600" text-anchor="middle">4 Lockable Cupboards</text>
  </g>

  <!-- Tag Pill -->
  <g transform="translate(30, 30)">
    <rect width="210" height="42" rx="21" fill="#0f2b48" opacity="0.9" stroke="#10b981" stroke-width="2" />
    <circle cx="24" cy="21" r="7" fill="#10b981" />
    <text x="40" y="26" fill="#ffffff" font-family="'Segoe UI', Poppins, sans-serif" font-size="13" font-weight="700">4-Sharing Room</text>
  </g>
</svg>
